name: Clients

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: :desktopApp:packageDeb :desktopApp:packageRpm
          - os: windows-latest
            tasks: :desktopApp:packageMsi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - run: ./gradlew --no-daemon ${{ matrix.tasks }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: app/desktopApp/build/compose/binaries/main/*/*

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git jdk17-openjdk go
      - uses: actions/checkout@v4
      # makepkg refuses to run as root
      - run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'cd app && ./gradlew --no-daemon :desktopApp:packageArch'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-Arch
          path: app/desktopApp/build/compose/binaries/main/arch/*.pkg.tar.zst

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/androidApp/build/outputs/apk/debug/*.apk
